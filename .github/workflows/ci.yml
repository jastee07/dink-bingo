name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # gradle/actions/setup-gradle validates the committed wrapper jar by
      # default, so this is deliberately redundant. It is kept explicit so the
      # check survives a change to how Gradle is set up below, and so it fails
      # before anything else runs. Do not add a second copy.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test Apps Script security helpers
        run: node backend/Code.test.js

      - name: Test and build plugin
        run: ./gradlew clean test jar --no-daemon
